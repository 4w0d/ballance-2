<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Kugellabyrinth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Kugellabyrinth Startseite"><span class="brand-orb"></span>Kugellabyrinth</a>
      <div class="hud" aria-live="polite">
        <span id="levelLabel">Level 1</span><span class="divider"></span><span id="timeLabel">00:00.0</span><span class="divider"></span><span id="starLabel">☆☆☆</span>
      </div>
      <button id="pauseButton" class="icon-button" aria-label="Spiel pausieren">Ⅱ</button>
    </header>

    <section class="game-wrap" aria-label="Spielfeld">
      <canvas id="gameCanvas" width="1280" height="800"></canvas>
      <div id="message" class="message" role="status"></div>
      <div id="toast" class="toast" role="status"></div>
    </section>

    <nav class="controls" aria-label="Spielsteuerung">
      <button id="restartButton" class="control-button">↻ <span>Neustart</span></button>
      <button id="calibrateButton" class="control-button">⌁ <span>Kalibrieren</span></button>
      <button id="levelsButton" class="control-button">▦ <span>Level</span></button>
      <button id="settingsButton" class="control-button">⚙ <span>Optionen</span></button>
    </nav>
  </main>

  <div id="modal" class="modal is-open" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="modal-card">
      <button id="closeModal" class="close" aria-label="Dialog schließen">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <template id="welcomeTemplate">
    <div class="hero-mark"><span></span></div>
    <p class="eyebrow">NEIGEN · ROLLEN · GEWINNEN</p>
    <h1 id="modalTitle">Kugellabyrinth</h1>
    <p class="lead">Führe die Kugel durch zehn präzise gebaute Labyrinthe. Kippe dein Smartphone oder nutze die Tastatur.</p>
    <div class="modal-actions">
      <button class="primary" data-action="start">Spiel starten <b>→</b></button>
      <button class="secondary" data-action="levels">Level auswählen</button>
    </div>
    <p class="hint">Tipp: Kalibriere die Lage vor jedem Lauf für maximale Präzision.</p>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="script.js"></script>
</body>
</html>
